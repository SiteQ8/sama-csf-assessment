<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <rect width="800" height="420" rx="10" fill="#f8fafb"/>
  <rect x="0" y="0" width="800" height="40" rx="10" fill="#ffffff"/>
  <rect x="0" y="30" width="800" height="10" fill="#ffffff"/>
  <line x1="0" y1="40" x2="800" y2="40" stroke="#e5e7eb"/>
  <circle cx="20" cy="20" r="6" fill="#ef4444"/>
  <circle cx="40" cy="20" r="6" fill="#eab308"/>
  <circle cx="60" cy="20" r="6" fill="#22c55e"/>
  <text x="400" y="24" fill="#6b7280" font-family="Inter,sans-serif" font-size="11" text-anchor="middle">SAMA CSF Assessment Tool — Assessment (Arabic RTL Mode)</text>

  <!-- Navbar -->
  <rect x="0" y="40" width="800" height="44" fill="#006c35"/>
  <text x="770" y="66" fill="#ffffff" font-family="Cairo,sans-serif" font-size="13" font-weight="700" text-anchor="end">إطار SAMA للأمن السيبراني</text>
  <g font-family="Cairo,sans-serif" font-size="11" fill="#ffffffcc">
    <text x="50" y="66" text-anchor="start">EN 🌐</text>
    <text x="130" y="66">التقارير</text>
    <text x="200" y="66">المصادر</text>
    <text x="270" y="66">التوافق</text>
    <rect x="335" y="52" width="65" height="24" rx="4" fill="#ffffff20"/>
    <text x="350" y="68" fill="#ffffff" font-weight="600">التقييم</text>
    <text x="420" y="66">الإطار</text>
    <text x="480" y="66">الرئيسية</text>
  </g>

  <!-- Assessment header -->
  <rect x="20" y="95" width="760" height="50" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="760" y="118" fill="#006c35" font-family="Cairo,sans-serif" font-size="15" font-weight="700" text-anchor="end">المجال 1: قيادة وحوكمة الأمن السيبراني</text>
  <text x="760" y="135" fill="#6b7280" font-family="Inter,sans-serif" font-size="11" text-anchor="end">D1: Cybersecurity Leadership and Governance · 15 controls</text>
  <rect x="30" y="108" width="60" height="26" rx="6" fill="#00a65120"/>
  <text x="60" y="125" fill="#006c35" font-family="Inter,sans-serif" font-size="11" text-anchor="middle">3.6 / 5</text>

  <!-- Question card -->
  <rect x="20" y="158" width="760" height="120" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="740" y="180" fill="#6b7280" font-family="Cairo,sans-serif" font-size="10" text-anchor="end">الضابط D1-1 · الحوكمة</text>
  <text x="740" y="198" fill="#1f2937" font-family="Cairo,sans-serif" font-size="13" font-weight="600" text-anchor="end">هل تمتلك المؤسسة سياسة أمن سيبراني معتمدة من مجلس الإدارة؟</text>
  <text x="740" y="216" fill="#6b7280" font-family="Inter,sans-serif" font-size="11" text-anchor="end">Does the organization have a board-approved cybersecurity policy?</text>
  
  <!-- Maturity level buttons (RTL) -->
  <g transform="translate(30, 235)">
    <rect x="0" y="0" width="110" height="30" rx="6" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
    <text x="55" y="19" fill="#6b7280" font-family="Inter,sans-serif" font-size="9" text-anchor="middle">L0 · غير موجود</text>
    
    <rect x="120" y="0" width="110" height="30" rx="6" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
    <text x="175" y="19" fill="#6b7280" font-family="Inter,sans-serif" font-size="9" text-anchor="middle">L1 · عشوائي</text>
    
    <rect x="240" y="0" width="110" height="30" rx="6" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
    <text x="295" y="19" fill="#6b7280" font-family="Inter,sans-serif" font-size="9" text-anchor="middle">L2 · غير رسمي</text>
    
    <rect x="360" y="0" width="110" height="30" rx="6" fill="#059669" stroke="#059669" stroke-width="1"/>
    <text x="415" y="19" fill="#ffffff" font-family="Inter,sans-serif" font-size="9" font-weight="600" text-anchor="middle">L3 · رسمي ✓</text>
    
    <rect x="480" y="0" width="110" height="30" rx="6" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
    <text x="535" y="19" fill="#6b7280" font-family="Inter,sans-serif" font-size="9" text-anchor="middle">L4 · مُدار</text>
    
    <rect x="600" y="0" width="110" height="30" rx="6" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
    <text x="655" y="19" fill="#6b7280" font-family="Inter,sans-serif" font-size="9" text-anchor="middle">L5 · متكيف</text>
  </g>

  <!-- Next question card -->
  <rect x="20" y="290" width="760" height="55" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="740" y="310" fill="#6b7280" font-family="Cairo,sans-serif" font-size="10" text-anchor="end">الضابط D1-2 · الأدوار والمسؤوليات</text>
  <text x="740" y="330" fill="#1f2937" font-family="Cairo,sans-serif" font-size="13" font-weight="600" text-anchor="end">هل تم تعيين مسؤول أمن المعلومات (CISO) بصلاحيات واضحة؟</text>

  <!-- Progress bar -->
  <rect x="20" y="360" width="760" height="44" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="740" y="380" fill="#6b7280" font-family="Inter,sans-serif" font-size="11" text-anchor="end">Progress: Question 3 of 15</text>
  <rect x="35" y="390" width="350" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="35" y="390" width="70" height="6" rx="3" fill="#006c35"/>
  <text x="35" y="381" fill="#006c35" font-family="Inter,sans-serif" font-size="10" font-weight="600">20%</text>
  <rect x="670" y="370" width="90" height="28" rx="6" fill="#006c35"/>
  <text x="715" y="388" fill="#ffffff" font-family="Inter,sans-serif" font-size="11" font-weight="600" text-anchor="middle">التالي →</text>
</svg>
