<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440">
  <rect width="800" height="440" rx="10" fill="#f8fafb"/>
  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="40" rx="10" fill="#ffffff"/>
  <rect x="0" y="30" width="800" height="10" fill="#ffffff"/>
  <line x1="0" y1="40" x2="800" y2="40" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="20" cy="20" r="6" fill="#ef4444"/>
  <circle cx="40" cy="20" r="6" fill="#eab308"/>
  <circle cx="60" cy="20" r="6" fill="#22c55e"/>
  <text x="400" y="24" fill="#6b7280" font-family="Inter,sans-serif" font-size="11" text-anchor="middle">SAMA CSF Assessment Tool — Dashboard</text>

  <!-- Navbar -->
  <rect x="0" y="40" width="800" height="44" fill="#006c35"/>
  <g transform="translate(20, 66)">
    <path d="M0,-12 L10,-7 L10,3 Q10,10 0,14 Q-10,10 -10,3 L-10,-7 Z" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <text x="18" y="3" fill="#ffffff" font-family="Inter,sans-serif" font-size="13" font-weight="700">SAMA CSF</text>
  </g>
  <g font-family="Inter,sans-serif" font-size="11" fill="#ffffffcc">
    <text x="300" y="66">Home</text>
    <text x="360" y="66">Framework</text>
    <rect x="430" y="52" width="80" height="24" rx="4" fill="#ffffff20"/>
    <text x="448" y="68" fill="#ffffff" font-weight="600">Assessment</text>
    <text x="530" y="66">Mappings</text>
    <text x="610" y="66">Resources</text>
    <text x="690" y="66">Reports</text>
    <text x="760" y="66">🌐 عربي</text>
  </g>

  <!-- Stat cards -->
  <g transform="translate(20, 100)">
    <rect x="0" y="0" width="185" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="15" y="24" fill="#6b7280" font-family="Inter,sans-serif" font-size="10">OVERALL MATURITY</text>
    <text x="15" y="55" fill="#006c35" font-family="Inter,sans-serif" font-size="28" font-weight="700">3.4</text>
    <text x="60" y="55" fill="#9ca3af" font-family="Inter,sans-serif" font-size="11">/ 5.0</text>
    <rect x="15" y="63" width="155" height="6" rx="3" fill="#e5e7eb"/>
    <rect x="15" y="63" width="105" height="6" rx="3" fill="#00a651"/>

    <rect x="200" y="0" width="185" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="215" y="24" fill="#6b7280" font-family="Inter,sans-serif" font-size="10">CONTROLS ASSESSED</text>
    <text x="215" y="55" fill="#1e3a5f" font-family="Inter,sans-serif" font-size="28" font-weight="700">89</text>
    <text x="255" y="55" fill="#9ca3af" font-family="Inter,sans-serif" font-size="11">/ 114</text>
    <text x="215" y="72" fill="#00a651" font-family="Inter,sans-serif" font-size="10">78% complete</text>

    <rect x="400" y="0" width="185" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="415" y="24" fill="#6b7280" font-family="Inter,sans-serif" font-size="10">GAPS IDENTIFIED</text>
    <text x="415" y="55" fill="#dc2626" font-family="Inter,sans-serif" font-size="28" font-weight="700">12</text>
    <text x="415" y="72" fill="#dc2626" font-family="Inter,sans-serif" font-size="10">Below Level 3 minimum</text>

    <rect x="600" y="0" width="170" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="615" y="24" fill="#6b7280" font-family="Inter,sans-serif" font-size="10">FRAMEWORK MAPS</text>
    <text x="615" y="55" fill="#7c3aed" font-family="Inter,sans-serif" font-size="28" font-weight="700">5</text>
    <text x="615" y="72" fill="#6b7280" font-family="Inter,sans-serif" font-size="10">ISO · NIST · CIS · PCI · NCA</text>
  </g>

  <!-- Radar chart -->
  <rect x="20" y="195" width="370" height="230" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="35" y="218" fill="#1f2937" font-family="Inter,sans-serif" font-size="13" font-weight="600">Domain Maturity Radar</text>
  
  <g transform="translate(205, 325)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <circle cx="0" cy="0" r="64" fill="none" stroke="#e5e7eb" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#e5e7eb" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#e5e7eb" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#e5e7eb" stroke-width="0.5"/>
    
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#e5e7eb" stroke-width="0.5"/>
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#e5e7eb" stroke-width="0.5"/>
    <line x1="-56" y1="-56" x2="56" y2="56" stroke="#e5e7eb" stroke-width="0.5"/>
    <line x1="56" y1="-56" x2="-56" y2="56" stroke="#e5e7eb" stroke-width="0.5"/>
    
    <!-- Data polygon -->
    <polygon points="0,-58 52,0 0,45 -38,0" fill="#00a651" fill-opacity="0.15" stroke="#00a651" stroke-width="2"/>
    <!-- Level 3 line (minimum) -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
    
    <text x="0" y="-88" fill="#4b5563" font-family="Inter,sans-serif" font-size="9" text-anchor="middle">D1: Leadership</text>
    <text x="90" y="4" fill="#4b5563" font-family="Inter,sans-serif" font-size="9" text-anchor="start">D2: Risk Mgmt</text>
    <text x="0" y="62" fill="#4b5563" font-family="Inter,sans-serif" font-size="9" text-anchor="middle">D3: Operations</text>
    <text x="-90" y="4" fill="#4b5563" font-family="Inter,sans-serif" font-size="9" text-anchor="end">D4: Third-Party</text>
  </g>

  <!-- Bar chart -->
  <rect x="410" y="195" width="370" height="230" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="425" y="218" fill="#1f2937" font-family="Inter,sans-serif" font-size="13" font-weight="600">Maturity by Domain</text>
  
  <g transform="translate(435, 240)">
    <text x="0" y="12" fill="#4b5563" font-family="Inter,sans-serif" font-size="10">D1: Leadership &amp; Governance</text>
    <rect x="0" y="18" width="320" height="16" rx="4" fill="#f3f4f6"/>
    <rect x="0" y="18" width="230" height="16" rx="4" fill="#00a651"/>
    <text x="236" y="30" fill="#1f2937" font-family="Inter,sans-serif" font-size="10" font-weight="600">3.6</text>
    
    <text x="0" y="55" fill="#4b5563" font-family="Inter,sans-serif" font-size="10">D2: Risk &amp; Compliance</text>
    <rect x="0" y="61" width="320" height="16" rx="4" fill="#f3f4f6"/>
    <rect x="0" y="61" width="192" height="16" rx="4" fill="#0891b2"/>
    <text x="198" y="73" fill="#1f2937" font-family="Inter,sans-serif" font-size="10" font-weight="600">3.0</text>
    
    <text x="0" y="98" fill="#4b5563" font-family="Inter,sans-serif" font-size="10">D3: Operations &amp; Technology</text>
    <rect x="0" y="104" width="320" height="16" rx="4" fill="#f3f4f6"/>
    <rect x="0" y="104" width="218" height="16" rx="4" fill="#059669"/>
    <text x="224" y="116" fill="#1f2937" font-family="Inter,sans-serif" font-size="10" font-weight="600">3.4</text>
    
    <text x="0" y="141" fill="#4b5563" font-family="Inter,sans-serif" font-size="10">D4: Third-Party Cybersecurity</text>
    <rect x="0" y="147" width="320" height="16" rx="4" fill="#f3f4f6"/>
    <rect x="0" y="147" width="166" height="16" rx="4" fill="#d97706"/>
    <text x="172" y="159" fill="#1f2937" font-family="Inter,sans-serif" font-size="10" font-weight="600">2.6</text>
    
    <!-- Level 3 line -->
    <line x1="192" y1="12" x2="192" y2="165" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
    <text x="192" y="180" fill="#dc2626" font-family="Inter,sans-serif" font-size="8" text-anchor="middle">Level 3 min.</text>
  </g>
</svg>
