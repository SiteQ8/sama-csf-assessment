<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
  <rect width="800" height="360" rx="10" fill="#f8fafb"/>
  <rect x="0" y="0" width="800" height="40" rx="10" fill="#ffffff"/>
  <rect x="0" y="30" width="800" height="10" fill="#ffffff"/>
  <line x1="0" y1="40" x2="800" y2="40" stroke="#e5e7eb"/>
  <circle cx="20" cy="20" r="6" fill="#ef4444"/>
  <circle cx="40" cy="20" r="6" fill="#eab308"/>
  <circle cx="60" cy="20" r="6" fill="#22c55e"/>
  <text x="400" y="24" fill="#6b7280" font-family="Inter,sans-serif" font-size="11" text-anchor="middle">SAMA CSF Assessment Tool — Framework Mappings</text>

  <!-- Title -->
  <text x="400" y="72" fill="#1f2937" font-family="Inter,sans-serif" font-size="16" font-weight="700" text-anchor="middle">SAMA CSF Framework Mappings</text>
  <text x="400" y="90" fill="#6b7280" font-family="Inter,sans-serif" font-size="11" text-anchor="middle">See how SAMA CSF aligns with international cybersecurity frameworks</text>

  <!-- Mapping cards -->
  <g transform="translate(30, 110)">
    <!-- ISO 27001 -->
    <rect x="0" y="0" width="145" height="110" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="0" y="0" width="145" height="4" rx="2" fill="#3b82f6"/>
    <text x="72" y="30" fill="#3b82f6" font-family="Inter,sans-serif" font-size="22" font-weight="700" text-anchor="middle">ISO</text>
    <text x="72" y="48" fill="#1f2937" font-family="Inter,sans-serif" font-size="11" font-weight="600" text-anchor="middle">ISO 27001:2022</text>
    <text x="72" y="68" fill="#6b7280" font-family="Inter,sans-serif" font-size="9" text-anchor="middle">Information Security</text>
    <text x="72" y="82" fill="#6b7280" font-family="Inter,sans-serif" font-size="9" text-anchor="middle">Management System</text>
    <rect x="30" y="90" width="85" height="14" rx="4" fill="#3b82f610"/>
    <text x="72" y="100" fill="#3b82f6" font-family="monospace" font-size="8" text-anchor="middle">93 mappings</text>
    
    <!-- NIST CSF -->
    <rect x="155" y="0" width="145" height="110" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="155" y="0" width="145" height="4" rx="2" fill="#059669"/>
    <text x="227" y="30" fill="#059669" font-family="Inter,sans-serif" font-size="22" font-weight="700" text-anchor="middle">NIST</text>
    <text x="227" y="48" fill="#1f2937" font-family="Inter,sans-serif" font-size="11" font-weight="600" text-anchor="middle">NIST CSF 2.0</text>
    <text x="227" y="68" fill="#6b7280" font-family="Inter,sans-serif" font-size="9" text-anchor="middle">Cybersecurity</text>
    <text x="227" y="82" fill="#6b7280" font-family="Inter,sans-serif" font-size="9" text-anchor="middle">Risk Management</text>
    <rect x="185" y="90" width="85" height="14" rx="4" fill="#05966910"/>
    <text x="227" y="100" fill="#059669" font-family="monospace" font-size="8" text-anchor="middle">87 mappings</text>
    
    <!-- CIS Controls -->
    <rect x="310" y="0" width="145" height="110" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="310" y="0" width="145" height="4" rx="2" fill="#7c3aed"/>
    <text x="382" y="30" fill="#7c3aed" font-family="Inter,sans-serif" font-size="22" font-weight="700" text-anchor="middle">CIS</text>
    <text x="382" y="48" fill="#1f2937" font-family="Inter,sans-serif" font-size="11" font-weight="600" text-anchor="middle">CIS Controls v8.1</text>
    <text x="382" y="68" fill="#6b7280" font-family="Inter,sans-serif" font-size="9" text-anchor="middle">Practical Security</text>
    <text x="382" y="82" fill="#6b7280" font-family="Inter,sans-serif" font-size="9" text-anchor="middle">Safeguards</text>
    <rect x="340" y="90" width="85" height="14" rx="4" fill="#7c3aed10"/>
    <text x="382" y="100" fill="#7c3aed" font-family="monospace" font-size="8" text-anchor="middle">76 mappings</text>
    
    <!-- PCI-DSS -->
    <rect x="465" y="0" width="145" height="110" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="465" y="0" width="145" height="4" rx="2" fill="#dc2626"/>
    <text x="537" y="30" fill="#dc2626" font-family="Inter,sans-serif" font-size="22" font-weight="700" text-anchor="middle">PCI</text>
    <text x="537" y="48" fill="#1f2937" font-family="Inter,sans-serif" font-size="11" font-weight="600" text-anchor="middle">PCI-DSS v4.0.1</text>
    <text x="537" y="68" fill="#6b7280" font-family="Inter,sans-serif" font-size="9" text-anchor="middle">Payment Card</text>
    <text x="537" y="82" fill="#6b7280" font-family="Inter,sans-serif" font-size="9" text-anchor="middle">Security Standard</text>
    <rect x="495" y="90" width="85" height="14" rx="4" fill="#dc262610"/>
    <text x="537" y="100" fill="#dc2626" font-family="monospace" font-size="8" text-anchor="middle">64 mappings</text>
    
    <!-- NCA -->
    <rect x="620" y="0" width="145" height="110" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="620" y="0" width="145" height="4" rx="2" fill="#d97706"/>
    <text x="692" y="30" fill="#d97706" font-family="Inter,sans-serif" font-size="22" font-weight="700" text-anchor="middle">NCA</text>
    <text x="692" y="48" fill="#1f2937" font-family="Inter,sans-serif" font-size="11" font-weight="600" text-anchor="middle">NCA ECC</text>
    <text x="692" y="68" fill="#6b7280" font-family="Inter,sans-serif" font-size="9" text-anchor="middle">Saudi Critical</text>
    <text x="692" y="82" fill="#6b7280" font-family="Inter,sans-serif" font-size="9" text-anchor="middle">Infrastructure</text>
    <rect x="650" y="90" width="85" height="14" rx="4" fill="#d9770610"/>
    <text x="692" y="100" fill="#d97706" font-family="monospace" font-size="8" text-anchor="middle">58 mappings</text>
  </g>

  <!-- Sample mapping table -->
  <rect x="30" y="235" width="740" height="110" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="45" y="258" fill="#1f2937" font-family="Inter,sans-serif" font-size="12" font-weight="600">Sample Mapping: D1-1 Cybersecurity Governance Policy</text>
  
  <!-- Table header -->
  <rect x="45" y="268" width="710" height="24" rx="4" fill="#f3f4f6"/>
  <text x="60" y="284" fill="#4b5563" font-family="Inter,sans-serif" font-size="9" font-weight="600">SAMA CSF</text>
  <text x="200" y="284" fill="#3b82f6" font-family="Inter,sans-serif" font-size="9" font-weight="600">ISO 27001</text>
  <text x="340" y="284" fill="#059669" font-family="Inter,sans-serif" font-size="9" font-weight="600">NIST CSF 2.0</text>
  <text x="480" y="284" fill="#7c3aed" font-family="Inter,sans-serif" font-size="9" font-weight="600">CIS Controls</text>
  <text x="620" y="284" fill="#dc2626" font-family="Inter,sans-serif" font-size="9" font-weight="600">PCI-DSS</text>
  
  <!-- Row -->
  <text x="60" y="308" fill="#006c35" font-family="monospace" font-size="10">D1-1</text>
  <text x="200" y="308" fill="#4b5563" font-family="Inter,sans-serif" font-size="10">A.5.1, A.5.2</text>
  <text x="340" y="308" fill="#4b5563" font-family="Inter,sans-serif" font-size="10">GV.PO-01</text>
  <text x="480" y="308" fill="#4b5563" font-family="Inter,sans-serif" font-size="10">CIS 1.1</text>
  <text x="620" y="308" fill="#4b5563" font-family="Inter,sans-serif" font-size="10">Req 12.1</text>
  
  <text x="60" y="330" fill="#006c35" font-family="monospace" font-size="10">D1-2</text>
  <text x="200" y="330" fill="#4b5563" font-family="Inter,sans-serif" font-size="10">A.5.4</text>
  <text x="340" y="330" fill="#4b5563" font-family="Inter,sans-serif" font-size="10">GV.RR-01</text>
  <text x="480" y="330" fill="#4b5563" font-family="Inter,sans-serif" font-size="10">CIS 1.1, 14.1</text>
  <text x="620" y="330" fill="#4b5563" font-family="Inter,sans-serif" font-size="10">Req 12.4</text>
</svg>
